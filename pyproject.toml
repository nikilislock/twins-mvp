[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "the-twins-lab"
version = "0.1.0"
description = "Observable twin-agent experiments on the FlyWire connectome"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy==2.4.4", "scipy==1.17.1", "pyarrow==23.0.1",
  "fastapi==0.135.3", "uvicorn==0.44.0"
]

[project.optional-dependencies]
test = ["pytest==9.0.2", "httpx==0.28.1"]

[project.scripts]
twins = "twins.__main__:main"

[tool.setuptools.packages.find]
include = ["twins*"]

[tool.setuptools.package-data]
twins = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

